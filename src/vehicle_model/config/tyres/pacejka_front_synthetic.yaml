model: pacejka
parameters:
  yaml_name: FRONT_TIRES_EXAMPLE
  c_kappa: 18.0
  camber: 0.0
  pressure: 250000.0
  nominal_vx: 20.0
  Fz0: 4668.0
provenance:
  formulation: Pacejka Magic Formula 6.2 (Front tyre dataset)
  version: "6.2"
  source: >-
    Repository illustrative front tyre YAML coefficients (FRONT_TIRES_EXAMPLE.yaml).
    Not validated against physical test bench measurements.
  data_class: synthetic
  reference_load: 4668.0
  valid_kappa: [-1.0, 1.0]
  valid_alpha: [-0.50, 0.50]
  limitations:
    - Pure lateral MF with friction circle combined slip coupling
    - Synthetic parameter values for research and simulation illustration
    - "Fy is clipped hard at mu*Fz, reached at ~2-3 deg (C_alpha/Fz ~ 33/rad at Fz0): no peak and no sliding range (Audit 4.6)"
    - "Fx = min(c_kappa*Fz*kappa, mu*Fz): linear up to a hard limit, no peak"
    - "Road friction mu multiplies the whole lateral curve, so the cornering stiffness scales with mu (unphysical)"
    - "Prefer magic_formula_passenger_synthetic for new work"
