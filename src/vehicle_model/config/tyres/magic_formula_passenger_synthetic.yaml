# Magic Formula 5.2 subset (src/vehicle_model/tire_model/magic_formula.py).
# Coefficient names as in Pacejka (2012), Tyre and Vehicle Dynamics, sec. 4.3.2;
# ISO sign convention adapted (alpha > 0 -> Fy > 0), all shifts zero (symmetric tyre).
model: magic_formula
parameters:
  Fz0: 4000.0     # [N] nominal load
  R0: 0.31        # [m] unloaded radius
  # longitudinal: C_kappa/Fz = 20 at Fz0, peak mu 1.0 at kappa ~ 0.11
  PCX1: 1.65
  PDX1: 1.00
  PDX2: -0.08
  PEX1: -0.20
  PEX2: 0.0
  PEX3: 0.0
  PKX1: 20.0
  PKX2: 0.0
  PKX3: -0.20
  # lateral: C_alpha/Fz = 18/rad at Fz0 (22 at Fz0/2, 12 at 1.75 Fz0), peak mu 1.0 at ~7 deg
  PCY1: 1.45
  PDY1: 1.00
  PDY2: -0.10
  PEY1: -0.50
  PEY2: 0.0
  PKY1: 21.2
  PKY2: 1.8
  # combined slip (cosine weighting on friction-normalised slips)
  RBX1: 12.0
  RBX2: 10.0
  RCX1: 1.0
  RBY1: 10.0
  RBY2: 8.0
  RCY1: 1.0
  # aligning moment: pneumatic trail 3.1 cm at Fz0, alpha -> 0
  QBZ1: 8.0
  QBZ2: -1.0
  QCZ1: 1.2
  QDZ1: 0.10
  QDZ2: -0.01
  QEZ1: -1.5
  QEZ2: 0.0
provenance:
  formulation: Magic Formula 5.2 subset (pure + combined slip, aligning moment)
  version: "1.0"
  source: >-
    Synthetic coefficients chosen to give textbook passenger-car characteristics
    (C_alpha/Fz ~ 18/rad, C_kappa/Fz ~ 20, peak mu ~ 1 at Fz0). Not fitted to, and
    not representative of, any real tyre.
  data_class: synthetic
  reference_load: 4000.0
  valid_kappa: [-1.0, 1.0]
  valid_alpha: [-0.35, 0.35]
  limitations:
    - No camber, pressure, turn slip, conicity or ply steer (symmetric tyre)
    - Mz without the s*Fx lever-arm term; no rolling-resistance or overturning moment
    - "Combined slip: friction-normalised MF 5.2 weighting plus friction-ellipse limiter"
    - Steady-state model; transient behaviour via TyreRelaxation
