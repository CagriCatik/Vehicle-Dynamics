[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-dynamics"
version = "0.1.0"
description = "Vehicle dynamics models, tire model demos, and visualization utilities."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["vehicle_model*", "vehicle_visualization*"]

[tool.setuptools.package-data]
vehicle_model = [
    "config/*.yaml",
    "data/**/*.csv",
    "tire_model/tire_data/**/*.yaml",
    "tire_model/tire_data/**/*.tir",
]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
