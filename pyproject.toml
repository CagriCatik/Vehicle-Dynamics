[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-dynamics"
version = "0.1.0"
description = "Vehicle dynamics models, tire model demos, and visualization utilities."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vehicle_model*"]

[tool.setuptools.package-data]
vehicle_model = [
    "config/*.yaml",
    "config/tyres/*.yaml",
    "data/**/*.csv",
    "tire_model/tire_data/**/*.yaml",
    "tire_model/tire_data/**/*.tir",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: long-running scenario and closed-loop tests; quick run: pytest -m 'not slow'",
]
