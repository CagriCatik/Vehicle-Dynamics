# Quarter-car suspension model parameters
#md estimation robustness)

sprung_mass: 375.0          # kg (ms, 1/4 of vehicle chassis)
unsprung_mass: 45.0         # kg (mu, wheel hub + brake + tyre)
suspension_stiffness: 35000.0  # N/m (ks, main coil spring)
suspension_damping: 2200.0     # Ns/m (cs, baseline hydraulic damper)
tyre_stiffness: 210000.0       # N/m (kt, radial tyre carcass stiffness)
tyre_damping: 250.0            # Ns/m (ct, internal rubber hysteresis damping)

# Operational limits
rattle_space_max: 0.08      # m (jounce limit)
rattle_space_min: -0.08     # m (rebound limit)
bump_stop_stiffness: 150000.0 # N/m (progressive elastomer engagement)
