simulation:
  dt: 0.05
  iteration_time: 120.0

initial_state:
  x: 0.0
  y: 0.0
  yaw_deg: 0.0
  v: 0.05

vehicle:
  wheelbase: 0.60
  max_accel: 4.5
  max_steer_front_deg: 25.0
  radius: 0.30

trajectory:
  target_v: 2.5        # m/s
  amplitude: 1.5       # m  – lateral swing
  frequency: 0.15      # Hz – wavelength = 2.5/0.15 = 16.7m (tight slalom)

obstacles: []          # no cones – pure sine analysis

# SLSQP single-shooting NMPC (see src/vehicle_model/controllers/nmpc.py).
# The former C/GMRES keys (zeta, ht, phi_*) were never read by the solver and were removed.
controller:
  tf: 1.5          # s   – steady-state horizon length
  alpha: 0.5       # 1/s – horizon ramp-up rate, dt = tf*(1-exp(-alpha*t))/N
  N: 8             # –   – horizon steps
  q_x: 0.0
  q_y: 25.0
  q_yaw: 3.0
  q_v: 20.0
  r_steer: 0.05
  r_accel: 0.01

paths:
  lut_json: "configs/steering/lut.json"
