type: robust_benchmark
name: robust_benchmark_sine_with_dwell
description: >
  M12 benchmark: the V2.0 baseline laws (PI, GS-LQR as of M6) against the robust and adaptive laws, each
  designed once from the nominal vehicle and run unchanged against six uncertainty cases in three feedback
  modes. Sine with dwell at 80 km/h, 6 deg amplitude, dry road (low_mu: 0.5).
vehicle: configs/vehicles/seven_dof_passenger.yaml
road: {type: uniform, mu: 1.0}
manoeuvre: {type: sine_with_dwell, speed_kph: 80, amplitude_deg: 6}
controllers:
  - {name: V2.0 PI, law: pi, baseline: true}
  - {name: V2.0 GS-LQR, law: gs_lqr, inputs: 4ws_tv, baseline: true}
  - {name: passive, law: passive}
  - {name: LTV-MPC, law: ltv_mpc, inputs: 4ws_tv}
  - {name: Robust LQR, law: robust_lqr, inputs: 4ws_tv, alpha: 3}
  - {name: GS-LQR + DOB, law: gs_lqr_dob, inputs: 4ws_tv, bandwidth: 12}
  - {name: Tightening MPC, law: tightening_mpc, inputs: 4ws_tv, w_max_vy: 0.3, w_max_r: 0.3}
  - {name: Adaptive LQR, law: adaptive_lqr, inputs: 4ws_tv}
  - {name: Supervised Tightening MPC, law: tightening_mpc, inputs: 4ws_tv, supervisor: {fallback: pi}}
feedback: [ideal, estimated, sensor_constrained]
uncertainty:
  - {name: nominal}
  - {name: heavy_rear_load, mass_factor: 1.2, Iz_factor: 1.25, cog_shift_m: -0.10}
  - {name: worn_rear_tyres, cornering_scale_rear: 0.7}
  - {name: low_mu, mu: 0.5}
  - {name: actuator_delay, actuator_delay_s: 0.04, actuator_tau_s: 0.03, control_latency_s: 0.01}
  - {name: degraded_sensors, sensor_noise_scale: 2.0, gyro_bias_radps: 0.02, sensor_latency_s: 0.02}
seed: 0
outputs: {directory: output/experiments/robust_benchmark_sine_with_dwell}
