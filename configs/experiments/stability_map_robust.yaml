type: stability_map
name: stability_map_robust
description: >
  Numerical recovery regions of the M12 laws (Plan 6.4, "robust controllers from M12"), same operating point
  and grid as stability_map_cornering: 80 km/h, 1 deg front steer held, mu 0.6. Passive and TV as references.
  All M12 laws act on rear steer and yaw moment and are designed once from the nominal vehicle.
vehicle: configs/vehicles/seven_dof_passenger.yaml
road: {type: uniform, mu: 0.6}
operating_point: {speed_kph: 80, steer_deg: 1.0}
grid: {beta_deg: [-20, 20, 15], r_degps: [-45, 45, 15]}
simulation: {dt: 0.01, duration_s: 6.0}
controllers: [passive, tv, robust_lqr, gs_lqr_dob, tightening_mpc, adaptive_lqr]
portraits: {controllers: [gs_lqr_dob, tightening_mpc], points: 5}
outputs: {directory: output/experiments/stability_map_robust}
