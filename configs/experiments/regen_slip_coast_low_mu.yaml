# recuperation and drag torque on a slippery road (mu 0.2). Coast (both pedals released) with a
# drag torque of 300 N m per wheel at 80 / 40 / 10 km/h: regen cut only under ABS (baseline, the existing
# brake-by-wire behaviour) against the regen slip loop (modulated). Dynamic actuators throughout.
type: controller_comparison
name: regen_slip_coast_low_mu
description: Regenerative slip control (MSR) under drag torque, cut-on-ABS against modulated.
vehicle: configs/vehicles/seven_dof_passenger.yaml
tyres: {front: magic_formula_passenger_synthetic, rear: magic_formula_passenger_synthetic}
road: {type: uniform, mu: 0.2}
manoeuvre: {type: coast, speed_kph: 80, duration_s: 8.0}
controllers:
  - {law: brakes, actuators: dynamic}
  - {law: brakes, actuators: dynamic, brake: {regen: cut_on_abs, coast_torque: 300}}
  - {law: brakes, actuators: dynamic, brake: {regen: modulated, coast_torque: 300}}
sweep: {parameter: manoeuvre.speed_kph, values: [80, 40, 10]}
outputs: {directory: output/brake_functions/regen_coast_low_mu, formats: [csv, json, md]}
