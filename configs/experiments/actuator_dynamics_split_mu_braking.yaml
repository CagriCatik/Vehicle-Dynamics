# the split-mu reference (configs/experiments/split_mu_braking.yaml) with ideal and with dynamic
# actuators (brake-by-wire hydraulics and regen blending, electric drives, steering actuators; configs/braking,
# configs/powertrains). Same plant, tyres, road, manoeuvre and integration for every run; the actuation trace
# requested -> allocated -> issued -> realised is in the histories.
type: controller_comparison
name: actuator_dynamics_split_mu_braking
description: Split-mu full braking, passive and yaw-rate PI, ideal vs dynamic actuators (actuation chain baseline).
vehicle: configs/vehicles/seven_dof_passenger.yaml
tyres: {front: magic_formula_passenger_synthetic, rear: magic_formula_passenger_synthetic}
road: {type: split_mu, mu_left: 1.0, mu_right: 0.2}
manoeuvre: {type: split_mu_braking, speed_kph: 90}
controllers:
  - {law: passive}
  - {law: passive, actuators: dynamic}
  - {law: pi}
  - {law: pi, actuators: dynamic}
dt: 0.005
seed: 0
outputs: {directory: output/actuation_chain/split_mu_braking, formats: [csv, json, png, md]}
