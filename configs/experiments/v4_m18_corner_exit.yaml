# Plan V4.0 M18: corner exit on mu 0.5: steady turn at 54 km/h with 3 deg steer (about 0.8 mu g), then full
# acceleration from t = 2 s with the steering held. Dynamic actuators.
type: controller_comparison
name: v4_m18_corner_exit
description: Corner exit with the traction functions.
vehicle: configs/vehicles/seven_dof_passenger.yaml
tyres: {front: magic_formula_passenger_synthetic, rear: magic_formula_passenger_synthetic}
road: {type: uniform, mu: 0.5}
manoeuvre: {type: corner_exit, speed_kph: 54, steer_deg: 3.0, accel_pedal: 1.0, accel_start_s: 2.0, duration_s: 6.0}
controllers:
  - {law: passive, actuators: dynamic}
  - {law: no_yaw, actuators: dynamic, traction: {distribution: open}}
  - {law: no_yaw, actuators: dynamic, traction: {distribution: elsd, lock_torque: 300}}
  - {law: no_yaw, actuators: dynamic}
  - {law: pi, actuators: dynamic}
  - {law: pi, actuators: dynamic, traction: {distribution: elsd, lock_torque: 300, envelope: true, yaw_tolerance: 2.0}}
  - {law: pi, actuators: dynamic, traction: {distribution: free, envelope: true, yaw_tolerance: 2.0}}
outputs: {directory: output/v4/m18/corner_exit, formats: [csv, json, png, md]}
