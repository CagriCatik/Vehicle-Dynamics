# predictive four-channel damping and active pitch on the 14-DOF model (the 7-DOF model has no
# vertical dynamics and is not used). Roads ISO 8608 A-D (seeded, synthetic), a single bump, transverse grooves;
# braking from 100 km/h on a wavy road, launch squat, cornering on an uneven road. Baselines passive, skyhook,
# groundhook, hybrid; preview skyhook with nominal, delayed/noisy and failed preview; active pitch; failed damper.
type: ride_benchmark
name: ride_preview_damping_active_pitch
description: Predictive damping and active pitch on the 14-DOF model.
vehicle: configs/suspension/fourteen_dof.yaml
scenarios:
  - {name: iso_A_80, road: {iso_class: A, seed: 3}, manoeuvre: {type: cruise, speed_kph: 80}, duration: 4.0}
  - {name: iso_B_80, road: {iso_class: B, seed: 3}, manoeuvre: {type: cruise, speed_kph: 80}, duration: 4.0}
  - {name: iso_C_60, road: {iso_class: C, seed: 3}, manoeuvre: {type: cruise, speed_kph: 60}, duration: 4.0}
  - {name: iso_D_40, road: {iso_class: D, seed: 3}, manoeuvre: {type: cruise, speed_kph: 40}, duration: 4.0}
  - {name: bump_60, road: {bumps: [{x: 30, length: 0.6, height: 0.06}]}, manoeuvre: {type: cruise, speed_kph: 60}, duration: 4.0}
  - {name: grooves_60, road: {grooves: {x0: 30, count: 6, spacing: 2.5, length: 0.3, depth: 0.025}}, manoeuvre: {type: cruise, speed_kph: 60}, duration: 4.0}
  - {name: brake_100_wavy, road: {iso_class: B, seed: 5}, manoeuvre: {type: brake, speed_kph: 100, decel_g: 0.6, start_s: 0.5}, duration: 4.0}
  - {name: launch_squat, road: {iso_class: A, seed: 5}, manoeuvre: {type: accel, speed_kph: 20, drive_torque: 3000, start_s: 0.5}, duration: 3.0}
  - {name: corner_iso_C_60, road: {iso_class: C, seed: 7}, manoeuvre: {type: corner, speed_kph: 60, steer_deg: 2.0}, duration: 4.0}
controllers:
  - {name: passive, damping: {mode: passive}}
  - {name: skyhook, damping: {mode: skyhook}}
  - {name: groundhook, damping: {mode: groundhook}}
  - {name: hybrid, damping: {mode: hybrid}}
  - {name: preview skyhook, damping: {mode: preview_skyhook}, preview: {distance: 8.0, latency: 0.02, noise_std: 0.0005}}
  - {name: "preview skyhook (late, noisy)", damping: {mode: preview_skyhook}, preview: {latency: 0.1, noise_std: 0.003}}
  - {name: preview skyhook (preview failed), damping: {mode: preview_skyhook}, preview: {failed: true}}
  - {name: active pitch + skyhook, damping: {mode: skyhook}, active_pitch: true}
  - {name: active pitch + passive, damping: {mode: passive}, active_pitch: true}
  - {name: "skyhook, FL damper failed", damping: {mode: skyhook, damper_failed: [FL]}}
outputs: {directory: output/ride_control/benchmark, formats: [csv, json, md]}
