# emergency braking during GVC (brake in a turn, pedal 0.5 from 2 s): GVC must yield to the driver's
# brake request and to ABS.
type: controller_comparison
name: g_vectoring_emergency_braking
description: GVC yields to emergency braking in a turn.
vehicle: configs/vehicles/seven_dof_passenger.yaml
tyres: {front: magic_formula_passenger_synthetic, rear: magic_formula_passenger_synthetic}
road: {type: uniform, mu: 1.0}
manoeuvre: {type: brake_in_turn, speed_kph: 80, steer_deg: 3.0, brake_pedal: 0.5, brake_start_s: 2.0, duration_s: 6.0}
controllers:
  - {law: pi}
  - {law: pi, gvc: {enabled: true}}
outputs: {directory: output/g_vectoring/emergency_braking, formats: [csv, json, md]}
