type: stability_map
name: stability_map_rear_steer
description: >
  Why do the LQR-type laws with rear steer recover fewer initial states than the passive vehicle? Same operating
  point and grid as stability_map_robust (80 km/h, 1 deg held, mu 0.6): the unchanged V2.0 GS-LQR with rear steer
  and yaw moment against the same law and the robust LQR with yaw moment only.
vehicle: configs/vehicles/seven_dof_passenger.yaml
road: {type: uniform, mu: 0.6}
operating_point: {speed_kph: 80, steer_deg: 1.0}
grid: {beta_deg: [-20, 20, 15], r_degps: [-45, 45, 15]}
simulation: {dt: 0.01, duration_s: 6.0}
controllers: [v2_gs_lqr, gs_lqr_tv, robust_lqr_tv]
portraits: {controllers: [v2_gs_lqr], points: 5}
outputs: {directory: output/experiments/stability_map_rear_steer}
