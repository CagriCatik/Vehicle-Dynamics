# critical scenario search critical scenario (generated by the search, then frozen as a regression case)
type: critical_scenario_search
name: critical_gs_lqr_small_steer_delay_24ms
description: 'critical scenario search regression case. Found by critical_search_sine_with_dwell (seed
  7), minimised: 88.5 km/h, 3.7 deg, 24 ms delay; rear steer saturates at -10 deg.
